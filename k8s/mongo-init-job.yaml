# Idempotent MongoDB replica-set initialization for Overleaf.
#
# Waits until mongod accepts connections, then runs rs.initiate() unless the
# replica set is already initialized. Exits 0 in both success cases so the Job
# completes and `kubectl wait --for=condition=complete job/mongo-init` works
# on every re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-init
  namespace: kovacovsky-ns
  labels:
    app.kubernetes.io/name: mongo-init
    app.kubernetes.io/part-of: overleaf
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-init
        app.kubernetes.io/part-of: overleaf
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:8.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              echo "waiting for mongod at mongo:27017 ..."
              for i in $(seq 1 60); do
                if mongosh --quiet mongodb://mongo:27017/admin --eval 'db.adminCommand({ ping: 1 }).ok' >/dev/null 2>&1; then
                  break
                fi
                sleep 2
              done

              mongosh --quiet mongodb://mongo:27017/admin --eval '
                try {
                  const status = rs.status();
                  if (status.ok === 1) {
                    print("replica set already initialized");
                    quit(0);
                  }
                  printjson(status);
                  quit(1);
                } catch (err) {
                  if (err.codeName === "NotYetInitialized" || err.code === 94 || err.code === 93) {
                    print("initializing replica set ...");
                    // Register the member under the StatefulSet-stable DNS name
                    // (headless service). A ClusterIP service name would break
                    // the replica set when the pod is recreated with a new IP.
                    printjson(rs.initiate({
                      _id: "overleaf",
                      members: [{ _id: 0, host: "mongo-0.mongo.kovacovsky-ns.svc.cluster.local:27017" }],
                    }));
                  } else {
                    printjson(err);
                    quit(1);
                  }
                }
              '

              echo "waiting for primary ..."
              for i in $(seq 1 60); do
                if mongosh --quiet mongodb://mongo:27017/admin --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
                  echo "primary is ready"
                  exit 0
                fi
                sleep 2
              done
              echo "timed out waiting for primary" >&2
              exit 1
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
