# Documentation only - no functional resources in this file.
#
# Target deployment facts (verified 2026-09-24):
#
#   Namespace:            kovacovsky-ns (Rancher cluster c-m-qvndqhf6, project p-54h9x)
#   Public hostname:      overleaf-kovacovsky-ns.dyn.cloud.e-infra.cz
#   Ingress class:        nginx (cert-manager issuer: letsencrypt-prod)
#   StorageClasses:       zfs-csi (RWO, WaitForFirstConsumer) - used for mongo + overleaf data
#                         nfs-csi (default, RWX)
#   LimitRange (default): 1 CPU / 512Mi per container (default only - explicit
#                         requests/limits in our manifests override it)
#   ResourceQuota:        requests 20 CPU / 40Gi, limits 32 CPU / 64Gi
#
# This manifest is intentionally just a ConfigMap so that `kubectl apply -f k8s/`
# stays harmless.
apiVersion: v1
kind: ConfigMap
metadata:
  name: overleaf-deploy-info
  namespace: kovacovsky-ns
  labels:
    app.kubernetes.io/part-of: overleaf
data:
  namespace: kovacovsky-ns
  hostname: overleaf-kovacovsky-ns.dyn.cloud.e-infra.cz
  overleaf-image: overleafcep/sharelatex:6.2.0-ext-v5.0
  mongo-image: mongo:8.0
  redis-image: redis:6.2
  github-sync-callback: https://overleaf-kovacovsky-ns.dyn.cloud.e-infra.cz/user/github-sync/oauth2/callback
