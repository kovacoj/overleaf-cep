# EXAMPLE ONLY - do not apply as-is, do not commit real values.
#
# The real secret is created out-of-band (see README.md):
#
#   set -a; source ../.env; set +a
#   kubectl create secret generic overleaf-secrets -n kovacovsky-ns \
#     --from-literal=GITHUB_SYNC_CLIENT_ID="$GITHUB_SYNC_CLIENT_ID" \
#     --from-literal=GITHUB_SYNC_CLIENT_SECRET="$GITHUB_SYNC_CLIENT_SECRET" \
#     --from-literal=OVERLEAF_INVITE_TOKEN_SECRET="$OVERLEAF_INVITE_TOKEN_SECRET" \
#     --from-literal=CRYPTO_RANDOM="$(openssl rand -base64 32 | tr -d '\n+/=')" \
#     --from-literal=WEB_API_PASSWORD="$(openssl rand -base64 32 | tr -d '\n+/=')" \
#     --from-literal=STAGING_PASSWORD="$(openssl rand -base64 32 | tr -d '\n+/=')" \
#     --from-literal=V1_HISTORY_PASSWORD="$(openssl rand -base64 32 | tr -d '\n+/=')" \
#     --from-literal=OT_JWT_AUTH_KEY="$(openssl rand -base64 32 | tr -d '\n+/=')" \
#     --from-literal=GITHUB_TOKEN_CIPHER_PASSWORD="$(openssl rand -base64 32 | tr -d '\n+/=')"
#
# Generate each value ONCE and keep it stable - regenerating invalidates
# sessions, stored GitHub tokens, and encrypted link-sharing tokens.
#
# After creating/updating the real secret, restart Overleaf to pick it up:
#
#   kubectl rollout restart deployment/overleaf -n kovacovsky-ns
#
# Key purpose:
#   GITHUB_SYNC_CLIENT_ID/SECRET     - GitHub OAuth app for GitHub Sync
#   OVERLEAF_INVITE_TOKEN_SECRET     - link-sharing token encryption (required)
#   CRYPTO_RANDOM                    - session/cookie secret (required)
#   WEB_API_PASSWORD                 - HTTP auth between internal services
#   STAGING_PASSWORD = V1_HISTORY_PASSWORD - history-v1 basic auth (must match!)
#   OT_JWT_AUTH_KEY                  - overleaf-editor JWT signing
#   GITHUB_TOKEN_CIPHER_PASSWORD     - GitHub Sync access-token encryption
#   ZOTERO_CLIENT_KEY/SECRET          - Zotero OAuth app (activates Zotero)
#   ZOTERO_TOKEN_CIPHER_PASSWORD     - Zotero token encryption
#   AI_TOKEN_CIPHER_PASSWORD         - encryption key for per-user e-INFRA
#                                      LLM API tokens (writing-assistant)
#
# e-INFRA LLM API keys are NOT stored here: every Overleaf user saves their
# own key in Account Settings (stored encrypted in MongoDB with
# AI_TOKEN_CIPHER_PASSWORD).
apiVersion: v1
kind: Secret
metadata:
  # Deliberately NOT named "overleaf-secrets" so that a blanket
  # `kubectl apply -f k8s/` can never clobber the real secret with
  # placeholder values.
  name: overleaf-secrets-example
  namespace: kovacovsky-ns
  labels:
    app.kubernetes.io/part-of: overleaf
type: Opaque
stringData:
  GITHUB_SYNC_CLIENT_ID: "replace-me"
  GITHUB_SYNC_CLIENT_SECRET: "replace-me"
  OVERLEAF_INVITE_TOKEN_SECRET: "replace-me-with-random-base64-32"
  CRYPTO_RANDOM: "replace-me-with-random-base64-32"
  WEB_API_PASSWORD: "replace-me-with-random-base64-32"
  STAGING_PASSWORD: "replace-me-with-random-base64-32"
  V1_HISTORY_PASSWORD: "replace-me-same-value-as-STAGING_PASSWORD"
  OT_JWT_AUTH_KEY: "replace-me-with-random-base64-32"
  GITHUB_TOKEN_CIPHER_PASSWORD: "replace-me-with-random-base64-32"
  ZOTERO_CLIENT_KEY: "replace-me-or-empty"
  ZOTERO_CLIENT_SECRET: "replace-me-or-empty"
  ZOTERO_TOKEN_CIPHER_PASSWORD: "replace-me-with-random-base64-32"
  AI_TOKEN_CIPHER_PASSWORD: "replace-me-with-random-base64-32"
