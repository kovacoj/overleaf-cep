# Self-hosted LanguageTool for grammar/style checking.
#
# ClusterIP only - never exposed via Ingress. The Overleaf backend proxies
# requests to it (language-assistant module), so browsers never talk to
# LanguageTool directly.
#
# erikvl87/languagetool listens on 8010 (not the LanguageTool default 8081);
# the Service maps 8081 -> 8010 to keep the conventional LanguageTool port
# on the network. Pipeline prewarming avoids cold-start latency for common
# languages. Heap sized to fit the 2Gi container limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: languagetool
  namespace: kovacovsky-ns
  labels:
    app.kubernetes.io/name: languagetool
    app.kubernetes.io/part-of: overleaf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: languagetool
  template:
    metadata:
      labels:
        app.kubernetes.io/name: languagetool
        app.kubernetes.io/part-of: overleaf
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: languagetool
          image: erikvl87/languagetool:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: Java_Xms
              value: 256m
            - name: Java_Xmx
              value: 1500m
            - name: langtool_pipelinePrewarming
              value: "true"
          ports:
            - name: http
              containerPort: 8010
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /v2/languages
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /v2/languages
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: languagetool
  namespace: kovacovsky-ns
  labels:
    app.kubernetes.io/name: languagetool
    app.kubernetes.io/part-of: overleaf
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8081
      targetPort: http
  selector:
    app.kubernetes.io/name: languagetool
